[package]
name = "rusttube"
version = "0.3.10"
edition = "2021"
rust-version = "1.85"
description = "A native YouTube client with cross-device cloud sync"
license = "AGPL-3.0-or-later"
build = "build.rs"

[dependencies]
# The whole UI: egui through eframe, with no browser engine anywhere.
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "blocking"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
egui_glow = "0.32"
# Check GitHub releases and replace the running app bundle in place.
self_update = { version = "1.3", default-features = false, features = [
    "github",
    "reqwest",
    "rustls",
    "archive-zip",
    "compression-zip-deflate",
    "checksums",
] }

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
